<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>graphraum laboratory</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
				background: #040f0f;
				color: #fcfffc;
			}
			* { box-sizing: border-box; }
			body { margin: 0; min-width: 320px; }
			button, input, select { font: inherit; }
			button, select, input[type="number"] {
				background: #0c2420;
				border: 1px solid #2d8b6a;
				border-radius: 0.45rem;
				color: #fcfffc;
				min-height: 2.25rem;
				padding: 0.4rem 0.65rem;
			}
			button { cursor: pointer; }
			button:hover, button:focus-visible { background: #164539; outline: none; }
			input[type="color"] {
				background: transparent;
				border: 0;
				height: 2rem;
				padding: 0;
				width: 2.5rem;
			}
			input[type="range"] { accent-color: #73c7a5; width: 100%; }
			.lab-shell {
				background: #061513;
				display: grid;
				height: 100vh;
				min-height: 38rem;
				overflow: hidden;
			}
			.toolbar {
				align-items: center;
				background: color-mix(in srgb, #071b18 94%, transparent);
				border-bottom: 1px solid #173a33;
				display: flex;
				gap: 0.65rem;
				padding: 0.75rem 1rem;
				z-index: 4;
			}
			.brand { font-size: 1.05rem; letter-spacing: -0.02em; }
			.eyebrow {
				color: #73c7a5;
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			.toolbar-copy { display: grid; gap: 0.15rem; margin-right: auto; }
			.status { color: #b8c9c1; font-size: 0.78rem; }
			.panel {
				background: #081d19;
				border-color: #173a33;
				color: #dce9e4;
				min-width: 0;
				overflow: auto;
			}
			.controls { padding: 0.9rem; }
			.controls form { display: grid; gap: 0.8rem; }
			fieldset {
				border: 1px solid #204b42;
				border-radius: 0.65rem;
				display: grid;
				gap: 0.65rem;
				margin: 0;
				min-width: 0;
				padding: 0.75rem;
			}
			legend {
				color: #73c7a5;
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				padding: 0 0.3rem;
				text-transform: uppercase;
			}
			label, .control-row {
				align-items: center;
				display: grid;
				font-size: 0.78rem;
				gap: 0.4rem;
				grid-template-columns: minmax(6.5rem, 1fr) minmax(5rem, 1fr);
			}
			.toggle { grid-template-columns: 1fr auto; }
			.kind-row {
				align-items: center;
				display: grid;
				gap: 0.4rem;
				grid-template-columns: minmax(4.5rem, 1fr) minmax(5rem, 1fr) auto;
			}
			.kind-row span { font-size: 0.78rem; text-transform: capitalize; }
			.canvas-panel { min-height: 0; min-width: 0; position: relative; }
			#graph { height: 100%; min-height: 18rem; width: 100%; }
			.canvas-badge {
				background: color-mix(in srgb, #071b18 88%, transparent);
				border: 1px solid #204b42;
				border-radius: 999px;
				color: #b8c9c1;
				font-size: 0.72rem;
				left: 0.75rem;
				padding: 0.35rem 0.55rem;
				pointer-events: none;
				position: absolute;
				top: 0.75rem;
			}
			.inspector { padding: 1rem; }
			.inspector h2 { font-size: 1rem; margin: 0.2rem 0; overflow-wrap: anywhere; }
			.inspector p { color: #b8c9c1; font-size: 0.8rem; margin: 0.3rem 0 1rem; }
			.inspector dl {
				display: grid;
				font-size: 0.76rem;
				gap: 0.35rem 0.75rem;
				grid-template-columns: auto 1fr;
				margin: 0 0 1rem;
			}
			.inspector dt { color: #73c7a5; }
			.inspector dd { margin: 0; overflow-wrap: anywhere; text-align: right; }
			.inspector-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
			.inspector-actions button { font-size: 0.76rem; }
			.prototype-switcher {
				align-items: center;
				background: #fcfffc;
				border-radius: 999px;
				bottom: 1rem;
				box-shadow: 0 0.5rem 2rem #0009;
				color: #040f0f;
				display: flex;
				gap: 0.35rem;
				left: 50%;
				padding: 0.3rem;
				position: fixed;
				transform: translateX(-50%);
				z-index: 10;
			}
			.prototype-switcher button {
				background: #226f54;
				border: 0;
				min-height: 2rem;
				padding: 0.25rem 0.65rem;
			}
			#variant-label { font-size: 0.75rem; font-weight: 700; min-width: 9rem; text-align: center; }

			body[data-variant="a"] .lab-shell {
				grid-template-columns: 18rem minmax(0, 1fr) 18rem;
				grid-template-rows: auto minmax(0, 1fr);
			}
			body[data-variant="a"] .toolbar { grid-column: 1 / -1; }
			body[data-variant="a"] .controls { border-right: 1px solid #173a33; }
			body[data-variant="a"] .inspector { border-left: 1px solid #173a33; }

			body[data-variant="b"] .lab-shell {
				grid-template-columns: minmax(0, 1fr) 19rem;
				grid-template-rows: auto auto minmax(0, 1fr);
			}
			body[data-variant="b"] .toolbar { grid-column: 1 / -1; }
			body[data-variant="b"] .controls {
				border-bottom: 1px solid #173a33;
				grid-column: 1 / -1;
				overflow-x: auto;
				padding: 0.65rem 1rem;
			}
			body[data-variant="b"] .controls form {
				display: flex;
				min-width: max-content;
			}
			body[data-variant="b"] fieldset { grid-auto-flow: column; grid-template-rows: repeat(3, auto); }
			body[data-variant="b"] .inspector { border-left: 1px solid #173a33; }

			body[data-variant="c"] .lab-shell { display: block; position: relative; }
			body[data-variant="c"] .toolbar {
				left: 0;
				position: absolute;
				right: 0;
				top: 0;
			}
			body[data-variant="c"] .canvas-panel { height: 100vh; }
			body[data-variant="c"] .controls,
			body[data-variant="c"] .inspector {
				backdrop-filter: blur(14px);
				background: color-mix(in srgb, #081d19 88%, transparent);
				border: 1px solid #204b42;
				border-radius: 0.8rem;
				box-shadow: 0 0.75rem 2.5rem #0008;
				max-height: calc(100vh - 8.5rem);
				position: absolute;
				top: 4.75rem;
				width: 18rem;
				z-index: 3;
			}
			body[data-variant="c"] .controls { left: 1rem; }
			body[data-variant="c"] .inspector { right: 1rem; }

			@media (max-width: 800px) {
				.lab-shell,
				body[data-variant="a"] .lab-shell,
				body[data-variant="b"] .lab-shell {
					display: flex;
					height: auto;
					min-height: 100vh;
					overflow: visible;
					flex-direction: column;
				}
				.toolbar { align-items: flex-start; flex-wrap: wrap; position: static; }
				.toolbar-copy { flex-basis: 100%; order: -1; }
				.canvas-panel { height: 55vh; min-height: 24rem; order: 1; }
				.controls { border: 0; order: 2; }
				.inspector { border: 0; order: 3; }
				body[data-variant="b"] .controls form { display: grid; min-width: 0; }
				body[data-variant="b"] fieldset { grid-auto-flow: row; grid-template-rows: none; }
				body[data-variant="c"] .lab-shell { display: flex; }
				body[data-variant="c"] .toolbar,
				body[data-variant="c"] .controls,
				body[data-variant="c"] .inspector {
					max-height: none;
					position: static;
					width: auto;
				}
				body[data-variant="c"] .canvas-panel { height: 55vh; }
			}
		</style>
	</head>
	<body data-variant="a">
		<main class="lab-shell">
			<header class="toolbar">
				<div class="toolbar-copy">
					<span class="eyebrow">Experimental playground</span>
					<strong class="brand">graphraum laboratory</strong>
					<span class="status" id="status">Preparing graph…</span>
				</div>
				<button type="button" id="fit">Fit view</button>
				<button type="button" id="update-node">Update node</button>
				<button type="button" id="inspect-edge">Inspect edge</button>
			</header>

			<aside class="controls panel" aria-label="Graph controls">
				<form id="controls">
					<fieldset>
						<legend>Renderer</legend>
						<label>Mode
							<select name="mode">
								<option value="2d">2D</option>
								<option value="3d">3D</option>
							</select>
						</label>
						<label class="toggle">Antialias <input name="antialias" type="checkbox" /></label>
						<label class="toggle">Viewport culling <input name="viewportCulling" type="checkbox" checked /></label>
						<label>Pixel ratio <input name="maxPixelRatio" type="number" min="0.5" max="4" step="0.5" value="2" /></label>
						<label>Edge budget <input name="maxVisibleEdges" type="number" min="1" step="1000" value="100000" /></label>
						<label>Overscan <input name="viewportOverscan" type="number" min="0" step="4" value="16" /></label>
					</fieldset>

					<fieldset>
						<legend>Dataset</legend>
						<label>Nodes
							<select name="nodeCount">
								<option value="100">100</option>
								<option value="1000" selected>1,000</option>
								<option value="10000">10,000</option>
								<option value="100000">100,000</option>
							</select>
						</label>
						<label>Edges / node <input name="edgeMultiplier" type="number" min="0" max="10" value="3" /></label>
						<label>Encoding
							<select name="encoding">
								<option value="mapper">Typed mapper</option>
								<option value="snapshot">Direct snapshot</option>
							</select>
						</label>
						<label>Base size <input name="nodeSize" type="range" min="1" max="12" step="0.5" value="3" /></label>
						<label>Score scale <input name="scoreSize" type="range" min="0" max="10" step="0.5" value="4" /></label>
					</fieldset>

					<fieldset>
						<legend>Node visuals</legend>
						<div class="kind-row"><span>Concept</span><select name="conceptShape"><option>circle</option><option>square</option><option selected>diamond</option></select><input aria-label="Concept color" name="conceptColor" type="color" value="#e4a853" /></div>
						<div class="kind-row"><span>Document</span><select name="documentShape"><option>circle</option><option selected>square</option><option>diamond</option></select><input aria-label="Document color" name="documentColor" type="color" value="#73c7a5" /></div>
						<div class="kind-row"><span>Person</span><select name="personShape"><option selected>circle</option><option>square</option><option>diamond</option></select><input aria-label="Person color" name="personColor" type="color" value="#fcfffc" /></div>
						<label>Mentions edge <input name="mentionsColor" type="color" value="#2d8b6a" /></label>
						<label>Related edge <input name="relatedColor" type="color" value="#226f54" /></label>
					</fieldset>

					<fieldset>
						<legend>Theme fallbacks</legend>
						<label>Background <input name="background" type="color" value="#040f0f" /></label>
						<label>Node <input name="node" type="color" value="#226f54" /></label>
						<label>Edge <input name="edge" type="color" value="#226f54" /></label>
						<label>Selection <input name="selectedNode" type="color" value="#fcfffc" /></label>
					</fieldset>
				</form>
			</aside>

			<section class="canvas-panel">
				<div id="graph"></div>
				<div class="canvas-badge">Pan · zoom · click a node</div>
			</section>

			<aside class="inspector panel" aria-live="polite">
				<span class="eyebrow">Presentation</span>
				<h2 id="presentation-title">Select a node</h2>
				<p id="presentation-subtitle">Compiled metadata appears here.</p>
				<dl id="presentation-properties"></dl>
				<div class="inspector-actions" id="presentation-actions"></div>
				<span class="eyebrow">Diagnostics</span>
				<dl id="diagnostics"></dl>
			</aside>
		</main>

		<nav class="prototype-switcher" id="prototype-switcher" aria-label="Prototype layout">
			<button type="button" id="previous-variant" aria-label="Previous layout">←</button>
			<span id="variant-label"></span>
			<button type="button" id="next-variant" aria-label="Next layout">→</button>
		</nav>

		<script type="module" src="./main.ts"></script>
	</body>
</html>
